name: Permissions Advisor

# permissions:
#   actions: read

on:
  workflow_call:
    inputs:
      files:
        description: 'Comma-separated list of workflow files to analyze'
        required: true
        type: string

      count:
        description: 'How many last runs to analyze'
        required: false
        type: string
        default: "2"

jobs:
  advisor:
    runs-on: ubuntu-latest
    strategy:
        matrix:
          files: ${{ fromJson(inputs.files) }}

    steps:
    - uses: actions/checkout@v2
 
    - name: Run Advisor for ${{ matrix.files }} file
      uses: GitHubSecurityLab/actions-permissions/advisor@v1
      with:
        name: ${{ matrix.files }}
        count: ${{ fromJSON(inputs.count) }}
      env:
        RUNNER_DEBUG: true
